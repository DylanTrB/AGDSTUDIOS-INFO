<!DOCTYPE html>
<html>
<title>AGD Roleplay Studios</title>
<body>

<header>
  <h1><span class="agd">AGD</span> STUDIOS</h1>
  <nav>
    <div class="lang-switch">
        <img src="./../img/Bandera_de_España_(sin_escudo).svg.png" alt="Español" onclick="changeLanguage('es')" class="flag">
        <img src="./../img/Flag_of_the_United_Kingdom_(1-2).svg" alt="English" onclick="changeLanguage('en')" class="flag">
    </div>
    <link rel="stylesheet" href="./../css/styles.css">
    <a href="./../index.html" id="nav-home">Inicio</a>
    <a href="#" id="nav-login">Login</a>
    <a href="servicios.html" id="nav-services">Servicios</a>
    <a href="sobre.html" id="nav-about">Sobre Nosotros</a>
    <a href="contacto.html" id="nav-contact">Contacto</a>
  </nav>
</header>

<div id="login">
  <h1 id="title-login">Inicio de sesión</h1>

  <form>
    <input type="text" id="input-usuario" placeholder="Usuario" required>
    <br><br>

    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Contraseña">
      <button type="button" id="toggle-password-btn" onclick="togglePassword()">👁</button>
    </div>

    <label id="label-recordarme">
      <input type="checkbox" id="checkbox-recordarme"> 
      <span id="text-recordarme">Recordarme</span>
    </label>
    <br><br>

    <button type="submit" id="btn-entrar">Entrar</button>

    <p id="error" style="color:red; display:none;">
      <span id="error-text">Usuario o contraseña incorrectos</span>
    </p>

    <br>

    <a href="#" id="link-forgot-password">¿Olvidaste tu contraseña?</a>
    <br><br>

    <p id="text-no-account">
      ¿No tienes cuenta? 
      <a href="#" id="link-register">Regístrate</a>
    </p>
  </form>
</div>

<link rel="stylesheet" href="styles.css">

<footer>
  <p id="footer-text">© 2026 AGD - Servidores FiveM GTA5 Roleplay</p>
</footer>

<script src="./../js/idioma.js"></script>
<script src="./../js/login.js"></script>

</body>
</html>
