<html>
<title>AGD Roleplay Studios</title>
<body>

<header>
  <h1><span class="agd">AGD</span> STUDIOS</h1>
  <nav>
    <div class="lang-switch">
        <img src="img/Bandera_de_España_(sin_escudo).svg.png" alt="Español" onclick="changeLanguage('es')" class="flag">
        <img src="img/Flag_of_the_United_Kingdom_(1-2).svg" alt="English" onclick="changeLanguage('en')" class="flag">

<div id="login">
  <h1>Inicio de sesión</h1>

  <form>
    <input type="text" placeholder="Usuario" required>
    <br><br>

    <div class="password-wrapper">
     <input type="password" id="password" placeholder="Contraseña">
     <button type="button" onclick="togglePassword()">👁</button>
    </div>

    <label>
      <input type="checkbox"> Recordarme
    </label>
    <br><br>

    <button type="submit">Entrar</button>

    <p id="error" style="color:red; display:none;">
      Usuario o contraseña incorrectos
    </p>

    <br>

    <a href="#">¿Olvidaste tu contraseña?</a>
    <br><br>

    <p>¿No tienes cuenta? <a href="#">Regístrate</a></p>
  </form>
</div>

<link rel="stylesheet" href="styles.css">

<footer>
